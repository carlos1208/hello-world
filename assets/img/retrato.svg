<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-label="Emblema de Johana Duque &amp; Consultores S.A.S">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16293C"/>
      <stop offset="55%" stop-color="#0F1E2E"/>
      <stop offset="100%" stop-color="#0A1420"/>
    </linearGradient>
    <!-- userSpaceOnUse: necesario para que el degradado pinte trazos de ancho cero -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="140" y1="90" x2="500" y2="640">
      <stop offset="0%" stop-color="#A5813E"/>
      <stop offset="50%" stop-color="#E4C88E"/>
      <stop offset="100%" stop-color="#A5813E"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="36%" r="56%">
      <stop offset="0%" stop-color="#C6A15B" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#C6A15B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lines" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="26" stroke="#FFFFFF" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="800" fill="url(#bg)"/>
  <rect width="640" height="800" fill="url(#lines)"/>
  <rect width="640" height="800" fill="url(#halo)"/>

  <!-- Sello circular -->
  <g transform="translate(320 296)" fill="none" stroke="url(#gold)">
    <circle r="182" stroke-opacity=".26" stroke-width="1"/>
    <circle r="158" stroke-opacity=".16" stroke-width="1" stroke-dasharray="2 9"/>
    <circle r="128" stroke-opacity=".42" stroke-width="1"/>
  </g>

  <!-- Balanza de la justicia -->
  <g transform="translate(320 288)" fill="none" stroke="url(#gold)" stroke-width="2.2"
     stroke-linecap="round" stroke-linejoin="round" opacity=".95">
    <path d="M0 -80 L0 76"/>
    <path d="M-66 -54 L66 -54"/>
    <path d="M-66 -54 L-95 10 L-37 10 Z"/>
    <path d="M66 -54 L37 10 L95 10 Z"/>
    <path d="M-34 76 L34 76"/>
    <path d="M-20 96 L20 96"/>
    <circle cx="0" cy="-88" r="5.5" fill="url(#gold)" stroke="none"/>
  </g>

  <!-- Monograma -->
  <text x="320" y="596" text-anchor="middle"
        font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif"
        font-size="128" font-weight="500" fill="url(#gold)" letter-spacing="8">JD</text>

  <!-- Ornamentos de esquina -->
  <g stroke="#C6A15B" stroke-opacity=".45" stroke-width="1" fill="none">
    <path d="M52 96 L52 52 L96 52"/>
    <path d="M588 96 L588 52 L544 52"/>
    <path d="M52 704 L52 748 L96 748"/>
    <path d="M588 704 L588 748 L544 748"/>
  </g>

  <rect x="20" y="20" width="600" height="760" fill="none" stroke="#FFFFFF" stroke-opacity=".10"/>
</svg>
